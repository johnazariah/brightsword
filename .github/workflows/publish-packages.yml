name: Publish all BrightSword packages

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check_permission:
    name: Ensure dispatcher is a repository member
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check collaborator permission
        run: |
          echo "Checking permission for actor: ${{ github.actor }}"
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission")
          PERM=$(echo "$RESPONSE" | jq -r .permission // empty)
          echo "Repo permission: $PERM"
          if [ -z "$PERM" ] || [ "$PERM" = "none" ]; then
            echo "Permission denied"; exit 1
          fi
          case "$PERM" in
            admin|write|maintain) echo "Allowed" ;;
            *) echo "Insufficient permission: $PERM"; exit 1 ;;
          esac

  build_test_pack:
    name: Build, test, and pack all packages
    runs-on: ubuntu-latest
    needs: check_permission
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: CI build (restore, build, test, pack)
        run: dotnet msbuild Build.proj /t:CI /p:Configuration=${{ inputs.configuration || 'Release' }} /v:minimal

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          retention-days: 7

  publish:
    name: Publish all packages to NuGet
    runs-on: ubuntu-latest
    needs: build_test_pack
    env:
      NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Publish
        shell: pwsh
        run: |
          if (-not $env:NUGET_API_KEY) { Write-Error "NUGET_API_KEY secret is required"; exit 1 }
          $source = if ($env:NUGET_SOURCE) { $env:NUGET_SOURCE } else { "https://api.nuget.org/v3/index.json" }
          $nupkgs = Get-ChildItem -Path artifacts/packages -Filter "*.nupkg" -File | Where-Object { $_.Name -notlike "*.snupkg" }
          if ($nupkgs.Count -eq 0) { Write-Error "No .nupkg files found"; exit 1 }

          Write-Host "Publishing $($nupkgs.Count) packages to $source"
          foreach ($pkg in $nupkgs) {
            Write-Host "  Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source $source --skip-duplicate
          }
          Write-Host "All packages published successfully"
